name: Android-APK bauen

# Baut eine installierbare Android-App (APK) in der Cloud – kein lokales
# Setup nötig. Läuft bei jedem Push und kann auch manuell gestartet werden
# (Tab "Actions" -> diesen Workflow -> "Run workflow").
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pakete holen
        run: flutter pub get

      - name: APK bauen (Release, mit Debug-Signatur zum Ausprobieren)
        run: flutter build apk --release --dart-define=SPOONACULAR_KEY=${{ secrets.SPOONACULAR }}

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: essensplan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
