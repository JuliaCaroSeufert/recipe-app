name: Rezept-Fotos holen

# Holt einmalig (server-seitig, ohne Browser-CORS) echte Spoonacular-Foto-URLs
# fuer alle Seed-Rezepte und committet sie nach lib/data/seed_photos.dart.
# Manuell starten: Actions -> "Rezept-Fotos holen" -> Run workflow.
on:
  push:
    branches: ['claude/gallant-bohr-s6ur6z']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    # Only run on manual dispatch or a push whose commit message opts in with
    # the [fetch-photos] marker — so it doesn't re-fetch on every push (and the
    # auto-commit below, which lacks the marker, doesn't loop).
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fetch-photos]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: claude/gallant-bohr-s6ur6z

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pakete holen
        run: flutter pub get

      - name: Fotos abrufen
        env:
          PEXELS_KEY: ${{ secrets.PEXELS }}
          SPOONACULAR_KEY: ${{ secrets.SPOONACULAR }}
        run: dart run tool/fetch_photos.dart

      - name: Ergebnis committen
        run: |
          if git diff --quiet -- lib/data/seed_photos.dart; then
            echo "Keine Aenderung an seed_photos.dart"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/seed_photos.dart
          git commit -m "Fetch Spoonacular seed photos (auto)"
          git push origin HEAD:claude/gallant-bohr-s6ur6z
